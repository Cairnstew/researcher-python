[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researcher-python"
version = "0.1.0"
description = "Unified scholarly search: one pipeline across arXiv, OpenAlex, Semantic Scholar, Crossref, and PubMed."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "arxiv>=4.0",
    "habanero>=2.3",
    "httpx>=0.27",
    "biopython>=1.84",
]

[project.scripts]
researcher-python = "researcher_python.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
include = ["researcher_python*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
