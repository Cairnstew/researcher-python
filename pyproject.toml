[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researcher-python"
version = "0.1.0"
description = "Unified scholarly research pipeline: search, screen, cite and read across arXiv, OpenAlex, Semantic Scholar, Crossref, PubMed, ACM DL and OpenAIRE."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "arxiv>=4.0",
    "habanero>=2.3",
    "httpx>=0.27",
    "biopython>=1.84",
]

[project.scripts]
researcher-python = "researcher_python.cli:main"
researcher-python-mcp = "researcher_python.mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
mcp = [
    "mcp>=1.9",
]
# PDF text extraction.  Optional: the whole package works without it, and only
# `extract` / the `extract_text` + `find_quotes` tools need it.
pdf = [
    "pypdf>=5",
]

[tool.setuptools.packages.find]
include = ["researcher_python*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
